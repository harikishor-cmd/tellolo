<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tellolo — for parents</title><style>
body{font-family:"Nunito",system-ui,sans-serif;margin:0;background:#fff8ec;color:#2b2b2b}header{display:flex;justify-content:space-between;padding:12px 20px;background:#fff;box-shadow:0 1px 3px #0001}
header b{font-size:24px;color:#ff7a3d}a{color:#555}main{max-width:900px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.big{font-size:32px;font-weight:700;color:#ff7a3d}.row{display:flex;gap:14px}.row .card{flex:1;text-align:center}.chips span{display:inline-block;background:#ffe9dc;border-radius:999px;padding:3px 12px;margin:3px;font-weight:600}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:8px;text-align:left;font-size:14px}.tag{font-size:11px;background:#eee;border-radius:6px;padding:2px 6px}.err{color:#b00020}.small{font-size:13px;color:#777}</style></head><body>
<header><b>Tellolo · for parents</b><a href="/">← back to reading</a></header><main>
<h2 id="hello">Reading progress</h2><div id="s">Loading…</div>
<p class="small">Kept only on this computer. Audio is never saved. <a href="/summary?all=1" id="allLink">Show all children and older test sessions</a></p></main>
<script>const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const all=location.search.includes('all=1');const q=new URLSearchParams(location.search);let child=q.get('child');let pname=null;
try{const p=JSON.parse(localStorage.tellolo_profile||'null');if(p){if(!child)child=p.child;if(p.child==child)pname=p.name}}catch(e){}
if(pname)document.getElementById('hello').textContent=pname+"'s reading progress";else if(child)document.getElementById('hello').textContent='Reading progress: '+child;
if(all)document.getElementById('allLink').outerHTML='<a href="/summary">Hide test sessions</a>';
fetch('/api/summary?'+(all?'all=1':'')+(child&&!all?'child='+encodeURIComponent(child):'')).then(r=>r.json()).then(d=>{if(d.child_name&&!all)document.getElementById('hello').textContent=d.child_name+"'s reading progress";let rows=d.rows;rows=rows.filter(r=>r.pages_read);const s=document.getElementById('s');if(!rows.length){s.innerHTML='<div class="card">No reading yet. Stories your child reads will show up here.</div>';return}
const pages=rows.reduce((a,r)=>a+r.pages_read,0),rates=rows.filter(r=>r.avg_error_rate!=null),acc=rates.length?100-100*rates.reduce((a,r)=>a+r.avg_error_rate,0)/rates.length:null,next=rows[0].next_words;
s.innerHTML=`<div class="row"><div class="card"><div class="big">${rows.length}</div>stories read</div><div class="card"><div class="big">${pages}</div>pages read aloud</div><div class="card"><div class="big">${acc==null?'-':Math.round(acc)+'%'}</div>words read well</div></div>
<div class="card"><b>Next story will practise:</b> <span class="chips">${next.map(w=>`<span>${esc(w)}</span>`).join('')||'-'}</span></div>
<div class="card"><table><tr><th>Story</th><th>Language</th><th>Practised</th><th>Pages</th><th>Read well</th><th>Tricky words</th></tr>`+
rows.map(r=>`<tr><td>${all&&r.child_name?'<b>'+esc(r.child_name)+'</b> · ':''}${esc(r.title)} ${r.parent?'<span class="tag">follow-up</span>':''} ${r.mode!='real'?'<span class="tag">'+esc(r.mode)+'</span>':''}</td><td>${r.language=='hi'?'Hindi':'English'}</td><td>${esc((r.trouble_words||[]).join(', '))}</td><td>${r.pages_read}/5</td><td>${r.avg_error_rate==null?'-':Math.round(100-100*r.avg_error_rate)+'%'}</td><td>${esc(r.flagged.join(', '))}</td></tr>`).join('')+'</table></div>'})
.catch(e=>document.getElementById('s').innerHTML='<span class="err">Could not load: '+esc(e.message)+'</span>')</script></body></html>
