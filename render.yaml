services:
  - type: web
    name: tellolo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: META_API_KEY
        sync: false
      - key: TELLOLO_PASSCODE  # required when hosted: testers enter it once per browser; share it only with testers
        sync: false
      - key: TELLOLO_SECRET  # signs session cookies; Render generates it
        generateValue: true
      - key: TELLOLO_KEEP_HOURS  # stories, reading results and names are deleted after this many hours untouched
        value: "24"
      - key: TELLOLO_DAILY_META_CALLS  # hard cap on Meta calls per day (~11 per story with pictures and 5 readings)
        value: "300"
      - key: TELLOLO_PROVIDER
        value: meta
